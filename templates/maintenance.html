<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Scheduled Maintenance — FreelanceTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: #0f0c1b;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .maint-card {
      background: rgba(25, 20, 44, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(111, 66, 193, 0.3);
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
    }
    .maint-icon {
      width: 80px;
      height: 80px;
      background: rgba(111, 66, 193, 0.2);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #6f42c1;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="maint-card">
    <div class="maint-icon"><i class="fas fa-tools"></i></div>
    <h3 class="fw-bold mb-2">System Under Maintenance</h3>
    <p class="text-muted mb-4">We are currently performing scheduled maintenance and system upgrades to enhance performance. Please check back shortly.</p>
    <a href="/login/" class="btn btn-outline-light btn-sm"><i class="fas fa-user-shield me-1"></i> Super Admin Login</a>
  </div>
</body>
</html>
