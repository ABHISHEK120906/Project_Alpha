<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Scheduled Maintenance — FreelanceHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/custom.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .maint-container {
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="theme-dark">
  <div class="fh-fixed-bg-canvas"></div>
  <div class="fh-fixed-bg-overlay"></div>

  <div class="maint-container">
    <div class="card p-5" style="border-top: 4px solid var(--accent-client);">
      <div style="width:72px; height:72px; border-radius:50%; background:rgba(125,60,255,0.12); border:1px solid rgba(125,60,255,0.25); display:inline-flex; align-items:center; justify-content:center; margin-bottom:24px; color:var(--accent-client);">
        <i data-lucide="wrench" style="width:32px; height:32px;"></i>
      </div>

      <h2 style="font-family:'Plus Jakarta Sans',sans-serif; font-size:1.6rem; font-weight:800; margin-bottom:12px; color:var(--text-primary);">System Under Maintenance</h2>
      
      <p style="font-size:0.95rem; color:var(--text-muted); line-height:1.6; margin-bottom:28px;">
        FreelanceHub is undergoing scheduled infrastructure upgrades to ensure high availability and security. Service will resume momentarily.
      </p>

      <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
        <a href="/login/" class="btn btn-secondary btn-sm">
          <i data-lucide="shield" class="fh-icon-xs"></i> Admin Access
        </a>
        <a href="/" class="btn btn-primary btn-sm">
          <i data-lucide="refresh-cw" class="fh-icon-xs"></i> Check Status
        </a>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) {
      lucide.createIcons();
    }
  </script>
</body>
</html>
