{% extends 'base.html' %}
{% block title %}Delete Task — FreelanceTrack{% endblock %}
{% block page_title %}<i class="fas fa-trash"></i> Delete Task{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-5">
  <div class="card" style="border-top:4px solid var(--danger);">
    <div class="card-body text-center p-5">
      <div style="width:64px;height:64px;background:rgba(239,68,68,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;"><i class="fas fa-exclamation-triangle" style="font-size:28px;color:#ef4444;"></i></div>
      <h3 style="font-weight:800;">Delete Task?</h3>
      <p style="color:var(--text-secondary);">Are you sure you want to delete <strong>{{ task.title }}</strong>?</p>
      <form method="post" class="d-flex justify-content-center gap-3 mt-4">
        {% csrf_token %}
        <a href="{% url 'core:task_list' %}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
