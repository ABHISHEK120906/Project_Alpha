{% extends 'auth_base.html' %}
{% block title %}Member Login — FreelanceTrack{% endblock %}

{% block content %}

<!-- Custom Styles for Brand Color System & Login Card -->
<style>
  body.auth-body {
    background: linear-gradient(135deg, #003333 0%, #002222 50%, #001A1A 100%) !important;
    overflow-x: hidden;
    font-family: 'Inter', sans-serif;
  }

  .auth-wrapper {
    position: relative;
    z-index: 10;
  }

  /* Left Panel styling */
  .auth-panel-left {
    background: linear-gradient(135deg, rgba(0,51,51,0.95) 0%, rgba(18,105,98,0.9) 100%) !important;
    border-right: 1px solid var(--brand-secondary-teal);
  }

  /* Card Container */
  .auth-card {
    background: var(--bg-card) !important;
    border: 1.5px solid var(--brand-secondary-teal) !important;
    box-shadow: 0 20px 60px rgba(0, 51, 51, 0.25) !important;
    backdrop-filter: blur(18px) !important;
    border-radius: 16px !important;
    padding: 44px 38px !important;
    text-align: center;
    max-width: 440px !important;
    position: relative;
    z-index: 20;
  }

  /* Title Header */
  .member-login-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  /* Role Selector Tabs */
  .role-selector-container {
    background: var(--bg-canvas) !important;
    border: 1.5px solid var(--brand-secondary-teal) !important;
    border-radius: 12px !important;
    padding: 4px !important;
    margin-bottom: 26px !important;
  }

  .role-selector-container button {
    color: var(--text-secondary);
    font-weight: 700;
  }

  /* Form Input Fields */
  .auth-form-group {
    margin-bottom: 20px;
  }
  .auth-input-wrapper {
    background: var(--bg-card) !important;
    border: 1.5px solid var(--brand-secondary-teal) !important;
    border-radius: 12px !important;
    transition: all 0.25s ease;
    overflow: hidden;
  }
  .auth-input-wrapper:focus-within {
    border-color: var(--brand-primary-teal) !important;
    box-shadow: 0 0 15px rgba(0, 127, 127, 0.25) !important;
  }
  .auth-input-icon {
    background: var(--brand-very-light-mint) !important;
    color: var(--brand-primary-dark) !important;
    border-right: 1px solid var(--brand-secondary-teal) !important;
    padding: 12px 16px !important;
    font-size: 15px;
  }
  .auth-input {
    color: var(--text-primary) !important;
    background: transparent !important;
    font-weight: 500;
  }
  .auth-input::placeholder {
    color: var(--text-muted) !important;
  }

  /* LOGIN Button */
  .btn-login-submit {
    width: 100%;
    padding: 14px;
    background: var(--brand-primary-teal);
    color: #FFFFFF !important;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    border: none;
    border-radius: 12px;
    transition: all 0.25s ease;
    margin-top: 10px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0, 127, 127, 0.35);
    cursor: pointer;
  }
  .btn-login-submit:hover {
    background: var(--brand-primary-dark);
    color: #FFFFFF !important;
    box-shadow: 0 6px 22px rgba(0, 51, 51, 0.45);
    transform: translateY(-1px);
  }

  /* Forgot Password Link */
  .forgot-pwd-link {
    color: var(--text-secondary);
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s ease;
    display: inline-block;
  }
  .forgot-pwd-link:hover {
    color: var(--brand-primary-teal);
    text-decoration: underline;
  }

  /* Separator Line */
  .auth-divider {
    height: 1px;
    background: var(--brand-secondary-teal);
    margin: 24px 0;
  }

  /* REGISTER Button */
  .btn-register-action {
    display: block;
    width: 100%;
    padding: 13px;
    background: var(--brand-light-mint);
    color: var(--brand-primary-dark) !important;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    border: none;
    border-radius: 12px;
    text-decoration: none;
    transition: all 0.25s ease;
    box-shadow: 0 4px 20px rgba(164, 240, 234, 0.35);
  }
  .btn-register-action:hover {
    background: var(--brand-very-light-mint);
    color: var(--brand-primary-dark) !important;
    box-shadow: 0 6px 28px rgba(210, 247, 244, 0.55);
    transform: translateY(-1px);
  }
</style>

<!-- Member Login Form Card -->
<div class="member-login-title">MEMBER LOGIN</div>

<!-- Role Selector (User vs Admin) -->
<div class="role-selector-container mb-4" style="display:flex;">
  <button type="button" id="btnUserLogin" class="btn flex-fill py-2 font-weight-bold" style="border-radius:8px; transition:all 0.25s ease; border:none; font-size:13px;" onclick="setLoginType('user')">
    <i class="fas fa-user me-1"></i> USER
  </button>
  <button type="button" id="btnAdminLogin" class="btn flex-fill py-2 font-weight-bold" style="border-radius:8px; transition:all 0.25s ease; border:none; font-size:13px;" onclick="setLoginType('admin')">
    <i class="fas fa-shield-alt me-1"></i> ADMIN
  </button>
</div>

{% if messages %}
  {% for message in messages %}
  <div class="auth-alert auth-alert-{{ message.tags }}" style="background:#FEF2F2;border:1px solid #FCA5A5;color:#DC2626;">
    <i class="fas fa-exclamation-circle me-1"></i>
    <span>{{ message }}</span>
  </div>
  {% endfor %}
{% endif %}

<form method="post" action="{% url 'core:login' %}" id="loginForm" novalidate>
  {% csrf_token %}
  <input type="hidden" name="login_type" id="login_type_input" value="{{ login_type|default:'user' }}">

  <!-- Username -->
  <div class="auth-form-group text-start">
    <div class="auth-input-wrapper d-flex align-items-center">
      <span class="auth-input-icon"><i class="fas fa-user"></i></span>
      <input
        type="text"
        name="username"
        id="id_username"
        class="auth-input form-control border-0 px-3 py-2"
        placeholder="Username"
        required
        autofocus
        autocomplete="username"
        value="{{ request.POST.username|default:'' }}"
      >
    </div>
  </div>

  <!-- Password -->
  <div class="auth-form-group text-start">
    <div class="auth-input-wrapper d-flex align-items-center position-relative">
      <span class="auth-input-icon"><i class="fas fa-lock"></i></span>
      <input
        type="password"
        name="password"
        id="id_password"
        class="auth-input form-control border-0 px-3 py-2"
        placeholder="Password"
        required
        autocomplete="current-password"
      >
      <button type="button" class="btn btn-link text-decoration-none py-0 px-3" id="togglePwd" style="color:var(--brand-primary-teal);" aria-label="Toggle password">
        <i class="fas fa-eye" id="pwdEyeIcon"></i>
      </button>
    </div>
  </div>

  <!-- LOGIN Submit Button -->
  <button type="submit" class="btn-login-submit" id="loginSubmitBtn">
    LOGIN
  </button>
</form>

<div class="mb-3">
  <a href="#" onclick="alert('Password reset instructions have been dispatched. Please contact your Super Admin for direct access.'); return false;" class="forgot-pwd-link">
    Forgot Password? <span style="text-decoration:underline;color:var(--brand-primary-teal);">Click Here</span>
  </a>
</div>

<div class="auth-divider"></div>

<!-- REGISTER Action Button -->
<a href="{% url 'core:register' %}" class="btn-register-action">
  REGISTER
</a>

<script>
function setLoginType(type) {
  document.getElementById('login_type_input').value = type;
  const btnUser = document.getElementById('btnUserLogin');
  const btnAdmin = document.getElementById('btnAdminLogin');
  const submitBtn = document.getElementById('loginSubmitBtn');

  if (type === 'admin') {
    btnAdmin.style.background = '#007F7F';
    btnAdmin.style.color = '#FFFFFF';
    btnAdmin.style.boxShadow = '0 2px 10px rgba(0,127,127,0.4)';
    btnUser.style.background = 'transparent';
    btnUser.style.color = 'var(--text-secondary)';
    btnUser.style.boxShadow = 'none';
    submitBtn.innerHTML = 'LOGIN AS ADMIN';
  } else {
    btnUser.style.background = '#007F7F';
    btnUser.style.color = '#FFFFFF';
    btnUser.style.boxShadow = '0 2px 10px rgba(0,127,127,0.4)';
    btnAdmin.style.background = 'transparent';
    btnAdmin.style.color = 'var(--text-secondary)';
    btnAdmin.style.boxShadow = 'none';
    submitBtn.innerHTML = 'LOGIN';
  }
}

(function() {
  const initialType = document.getElementById('login_type_input').value || 'user';
  setLoginType(initialType);

  // Password visibility toggle
  const pwdInput = document.getElementById('id_password');
  const pwdEye   = document.getElementById('pwdEyeIcon');
  if (pwdInput && pwdEye) {
    document.getElementById('togglePwd').addEventListener('click', function() {
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        pwdEye.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwdInput.type = 'password';
        pwdEye.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  }
})();
</script>
{% endblock %}
