{% extends 'auth_base.html' %}
{% block title %}Password Reset — FreelanceTrack{% endblock %}

{% block content %}
<style>
  .auth-card { text-align: center; }

  .done-icon {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, rgba(34,197,94,0.15) 0%, rgba(22,163,74,0.1) 100%);
    border: 2px solid rgba(34,197,94,0.3);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
    animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.6); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .done-icon i { font-size: 30px; color: #16a34a; }
  [data-theme="dark"] .done-icon { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.2); }

  .done-title {
    font-size: 22px; font-weight: 800;
    color: #1A2530; margin-bottom: 10px;
    font-family: 'DM Sans', sans-serif;
  }
  [data-theme="dark"] .done-title { color: #E5E5DF; }

  .done-body {
    font-size: 13.5px; color: #6A7480; line-height: 1.7;
    margin-bottom: 28px; font-family: 'Inter', sans-serif;
  }
  [data-theme="dark"] .done-body { color: #8A8070; }

  .btn-back-login {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #DB9941 0%, #C8881E 50%, #B87818 100%);
    color: #07111D !important;
    font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 2px;
    border: none; border-radius: 12px; text-decoration: none;
    box-shadow: 0 4px 18px rgba(200,136,30,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative; overflow: hidden;
  }
  .btn-back-login::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 60%);
    pointer-events: none;
  }
  .btn-back-login:hover {
    box-shadow: 0 10px 28px rgba(200,136,30,0.5);
    transform: translateY(-2px) scale(1.01);
    color: #07111D !important;
  }
  .btn-back-login:active { transform: translateY(0) scale(0.99); }
</style>

<!-- Success Icon -->
<div class="done-icon"><i class="fas fa-check-circle"></i></div>

<h1 class="done-title">Password updated!</h1>
<p class="done-body">
  Your password has been successfully reset.<br>
  You can now sign in with your new password.
</p>

<a href="{% url 'core:login' %}" class="btn-back-login">
  <i class="fas fa-arrow-right-to-bracket"></i> Go to Login
</a>

{% endblock %}
