{% extends 'auth_base.html' %}
{% block title %}Password Changed — FreelanceTrack{% endblock %}

{% block content %}
<style>
  .auth-card {
    backdrop-filter: blur(18px) !important;
    border-radius: 20px !important;
    padding: 48px 36px !important;
    text-align: center;
    max-width: 420px !important;
  }
  .success-icon {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, rgba(34,197,94,0.15) 0%, rgba(22,163,74,0.08) 100%);
    border: 2px solid rgba(34,197,94,0.3);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes bounceIn {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.1); }
    100% { transform: scale(1);   opacity: 1; }
  }
  .success-icon i { font-size: 34px; color: #16a34a; }
  [data-theme="dark"] .success-icon { background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.2); }

  .success-title {
    font-size: 24px; font-weight: 800;
    color: #1A2530; margin-bottom: 10px;
    font-family: 'DM Sans', sans-serif;
  }
  [data-theme="dark"] .success-title { color: #E5E5DF; }

  .success-body {
    font-size: 14px; color: #6A7480; line-height: 1.7;
    margin-bottom: 32px; font-family: 'Inter', sans-serif;
  }
  [data-theme="dark"] .success-body { color: #8A8070; }

  .btn-go-login {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #DB9941 0%, #C8881E 50%, #B87818 100%);
    color: #07111D !important;
    font-size: 14px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 2px;
    border: none; border-radius: 12px; text-decoration: none;
    box-shadow: 0 4px 18px rgba(200,136,30,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative; overflow: hidden;
  }
  .btn-go-login::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 60%);
    pointer-events: none;
  }
  .btn-go-login:hover {
    box-shadow: 0 10px 28px rgba(200,136,30,0.5);
    transform: translateY(-2px) scale(1.01);
    color: #07111D !important;
  }
</style>

<!-- Animated success icon -->
<div class="success-icon"><i class="fas fa-shield-check"></i></div>

<h1 class="success-title">Password changed!</h1>
<p class="success-body">
  Your password has been successfully updated.<br>
  You can now sign in with your new password.
</p>

<a href="{% url 'core:login' %}" class="btn-go-login">
  <i class="fas fa-sign-in-alt"></i> Go to Login
</a>
{% endblock %}
