{% extends 'base.html' %}
{% block title %}Delete Note — FreelanceHub{% endblock %}
{% block page_title %}Delete Note{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card" style="border-top:4px solid var(--danger); overflow:hidden;">
      <div class="card-body-hub text-center p-4 p-md-5">
        <div style="width:64px;height:64px;background:var(--danger-soft);border:1px solid rgba(224,92,92,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
          <i data-lucide="alert-triangle" style="width:28px;height:28px;color:var(--danger-text);"></i>
        </div>
        <h3 style="font-weight:800;color:var(--text-primary);margin-bottom:8px;">Delete Note?</h3>
        <p style="color:var(--text-secondary);font-size:14px;line-height:1.5;">
          Permanently delete <strong style="color:var(--text-primary);">{{ note.title }}</strong>? This action cannot be undone.
        </p>
        <form method="post" class="d-flex justify-content-center gap-3 mt-4">
          {% csrf_token %}
          <a href="{% url 'core:note_list' %}" class="btn-hub-secondary">
            <i data-lucide="x" style="width:15px;height:15px;"></i> <span>Cancel</span>
          </a>
          <button type="submit" class="btn-hub-danger">
            <i data-lucide="trash-2" style="width:15px;height:15px;"></i> <span>Yes, Delete</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
