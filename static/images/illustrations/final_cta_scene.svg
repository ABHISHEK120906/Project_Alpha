<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ctaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="ctaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="24" fill="url(#ctaBgGrad)"/>

  <!-- Geometric & Organic Background elements -->
  <circle cx="100" cy="180" r="140" fill="#6366f1" opacity="0.15"/>
  <circle cx="500" cy="180" r="140" fill="#10b981" opacity="0.15"/>

  <!-- Left: Client Figure -->
  <g transform="translate(140, 100)">
    <circle cx="50" cy="40" r="28" fill="#fcd34d"/>
    <path d="M25 35 Q50 5 75 35 Q70 10 40 10 Q25 15 25 35 Z" fill="#475569"/>
    <path d="M15 170 L30 85 Q50 75 70 85 L85 170 Z" fill="#3b82f6"/>
    <!-- Raised arm (high five / wave) -->
    <path d="M65 95 Q95 80 120 70" stroke="#fcd34d" stroke-width="14" stroke-linecap="round"/>
    <path d="M65 95 Q90 82 110 75" stroke="#3b82f6" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Central Collaborative Sparkle / Success Badge -->
  <g transform="translate(260, 110)" filter="url(#ctaShadow)">
    <circle cx="40" cy="40" r="36" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <polygon points="40,16 46,32 64,40 46,48 40,64 34,48 16,40 34,32" fill="#f59e0b"/>
    <circle cx="40" cy="40" r="8" fill="#10b981"/>
  </g>

  <!-- Right: Freelancer Figure -->
  <g transform="translate(360, 100)">
    <circle cx="50" cy="40" r="28" fill="#fbcfe8"/>
    <path d="M25 35 Q20 5 60 10 Q85 15 80 40 Q75 5 45 5 Q25 10 25 35 Z" fill="#0f172a"/>
    <path d="M15 170 L30 85 Q50 75 70 85 L85 170 Z" fill="#8b5cf6"/>
    <!-- Raised arm to meet client -->
    <path d="M35 95 Q5 80 -20 70" stroke="#fbcfe8" stroke-width="14" stroke-linecap="round"/>
    <path d="M35 95 Q10 82 -10 75" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Floating Achievement Pills -->
  <g transform="translate(60, 240)" filter="url(#ctaShadow)">
    <rect width="140" height="40" rx="20" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#6366f1" opacity="0.3"/>
    <text x="38" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Project Delivered</text>
  </g>

  <g transform="translate(400, 240)" filter="url(#ctaShadow)">
    <rect width="140" height="40" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <circle cx="20" cy="20" r="10" fill="#10b981" opacity="0.3"/>
    <text x="38" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Payment Released</text>
  </g>
</svg>
