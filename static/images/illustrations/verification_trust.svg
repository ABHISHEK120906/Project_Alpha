<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="trustBgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient background circle -->
  <circle cx="300" cy="240" r="210" fill="url(#trustBgGlow)"/>

  <!-- Connecting Security Rings -->
  <circle cx="300" cy="240" r="170" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="300" cy="240" r="130" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3"/>

  <!-- Central Crest / Trust Shield -->
  <g transform="translate(230, 160)" filter="url(#shieldShadow)">
    <path d="M70 0 L135 25 C135 95 100 145 70 160 C40 145 5 95 5 25 Z" fill="url(#shieldGrad)" stroke="#34d399" stroke-width="3"/>
    <path d="M70 12 L123 33 C123 93 93 133 70 146 C47 133 17 93 17 33 Z" fill="#064e3b" opacity="0.4"/>
    <!-- Big Checkmark -->
    <path d="M46 78 L62 94 L94 62" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Checkpoint 1: Email Verified (Top Left) -->
  <g transform="translate(70, 70)">
    <rect width="150" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M18 22 L26 28 L34 22 M18 30 L23 26 M34 30 L29 26" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="50" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Email Verified</text>
    <text x="50" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">OTP Confirmed</text>
  </g>

  <!-- Checkpoint 2: Phone Verified (Top Right) -->
  <g transform="translate(380, 70)">
    <rect width="150" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M22 18 L30 18 L30 34 L22 34 Z M26 31 L26 31.5" stroke="#10b981" stroke-width="1.5" stroke-linecap="round"/>
    <text x="50" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Phone Verified</text>
    <text x="50" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">2-Step Secured</text>
  </g>

  <!-- Checkpoint 3: Identity / KYC (Mid Left) -->
  <g transform="translate(30, 210)">
    <rect width="160" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#10b981" opacity="0.2"/>
    <circle cx="26" cy="23" r="4" fill="#10b981"/>
    <path d="M19 32 C19 28 22 27 26 27 C30 27 33 28 33 32" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="50" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Identity Verified</text>
    <text x="50" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Government ID Checked</text>
  </g>

  <!-- Checkpoint 4: Professional Profile (Mid Right) -->
  <g transform="translate(410, 210)">
    <rect width="160" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#10b981" opacity="0.2"/>
    <polygon points="26,17 28.5,23 35,23.5 30,28 31.5,34.5 26,31 20.5,34.5 22,28 17,23.5 23.5,23" fill="#10b981"/>
    <text x="50" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Pro Profile 100%</text>
    <text x="50" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Skills &amp; Portfolio Vetted</text>
  </g>

  <!-- Checkpoint 5: Payment Account (Bottom Left) -->
  <g transform="translate(70, 350)">
    <rect width="150" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#10b981" opacity="0.2"/>
    <rect x="18" y="21" width="16" height="10" rx="2" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <line x1="18" y1="24" x2="34" y2="24" stroke="#10b981" stroke-width="1.5"/>
    <text x="50" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Payment Account</text>
    <text x="50" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">KYC Validated</text>
  </g>

  <!-- Checkpoint 6: Admin Approval (Bottom Right) -->
  <g transform="translate(380, 350)">
    <rect width="150" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#10b981" opacity="0.2"/>
    <path d="M20 26 L24 30 L32 20" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="24" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Admin Approved</text>
    <text x="50" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Platform Cleared</text>
  </g>
</svg>
