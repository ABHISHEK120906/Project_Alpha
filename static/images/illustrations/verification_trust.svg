<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c3736"/>
      <stop offset="50%" stop-color="#eaaa64"/>
      <stop offset="100%" stop-color="#df984d"/>
    </linearGradient>
    <linearGradient id="trustBgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9d5d5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#eaaa64" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3c3736" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient background circle -->
  <circle cx="300" cy="240" r="210" fill="url(#trustBgGlow)"/>

  <!-- Connecting Security Rings -->
  <circle cx="300" cy="240" r="170" stroke="#eaaa64" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="300" cy="240" r="130" stroke="#f9d5d5" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>

  <!-- Central Crest / Trust Shield -->
  <g transform="translate(230, 160)" filter="url(#shieldShadow)">
    <path d="M70 0 L135 25 C135 95 100 145 70 160 C40 145 5 95 5 25 Z" fill="url(#shieldGrad)" stroke="#eaaa64" stroke-width="3"/>
    <path d="M70 12 L123 33 C123 93 93 133 70 146 C47 133 17 93 17 33 Z" fill="#242020" opacity="0.5"/>
    <!-- Big Checkmark -->
    <path d="M46 78 L62 94 L94 62" stroke="#f4f0ed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Checkpoint 1: Email Verified (Top Left) -->
  <g transform="translate(70, 70)">
    <rect width="150" height="52" rx="10" fill="#3c3736" stroke="#eaaa64" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#eaaa64" opacity="0.2"/>
    <path d="M18 22 L26 28 L34 22 M18 30 L23 26 M34 30 L29 26" stroke="#eaaa64" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="50" y="24" fill="#f4f0ed" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Email Verified</text>
    <text x="50" y="38" fill="#eaaa64" font-family="'Outfit', sans-serif" font-size="9">OTP Confirmed</text>
  </g>

  <!-- Checkpoint 2: Phone Verified (Top Right) -->
  <g transform="translate(380, 70)">
    <rect width="150" height="52" rx="10" fill="#3c3736" stroke="#eaaa64" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#eaaa64" opacity="0.2"/>
    <path d="M22 18 L30 18 L30 34 L22 34 Z M26 31 L26 31.5" stroke="#eaaa64" stroke-width="1.5" stroke-linecap="round"/>
    <text x="50" y="24" fill="#f4f0ed" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Phone Verified</text>
    <text x="50" y="38" fill="#eaaa64" font-family="'Outfit', sans-serif" font-size="9">SMS 2FA Active</text>
  </g>

  <!-- Checkpoint 3: KYC Identity (Bottom Left) -->
  <g transform="translate(70, 360)">
    <rect width="160" height="52" rx="10" fill="#3c3736" stroke="#f9d5d5" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#f9d5d5" opacity="0.2"/>
    <circle cx="26" cy="23" r="4.5" fill="#f9d5d5"/>
    <path d="M19 32 C19 28 22 27 26 27 C30 27 33 28 33 32" stroke="#f9d5d5" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <text x="50" y="24" fill="#f4f0ed" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Gov ID Approved</text>
    <text x="50" y="38" fill="#f9d5d5" font-family="'Outfit', sans-serif" font-size="9">Manual Admin Review</text>
  </g>

  <!-- Checkpoint 4: Milestone Escrow (Bottom Right) -->
  <g transform="translate(370, 360)">
    <rect width="160" height="52" rx="10" fill="#3c3736" stroke="#eaaa64" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="#eaaa64" opacity="0.2"/>
    <rect x="18" y="20" width="16" height="12" rx="3" stroke="#eaaa64" stroke-width="1.5" fill="none"/>
    <path d="M22 20 V16 A4 4 0 0 1 30 16 V20" stroke="#eaaa64" stroke-width="1.5" fill="none"/>
    <text x="50" y="24" fill="#f4f0ed" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Escrow Protected</text>
    <text x="50" y="38" fill="#eaaa64" font-family="'Outfit', sans-serif" font-size="9">Milestone Release</text>
  </g>
</svg>
