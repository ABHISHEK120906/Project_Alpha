<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%" fill="none">
  <defs>
    <!-- Admin & Main Brand Palettes: Grassy Green #9bc400, Purple Mountains Majesty #8076a3, Misty Mountain Pink #f9c5bd, Factory Stone Purple #7c677f -->
    <linearGradient id="mainGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8076a3" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7c677f" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9bc400" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="nodeClientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7d3cff"/>
      <stop offset="100%" stop-color="#8076a3"/>
    </linearGradient>

    <linearGradient id="nodeFreelancerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9bc400"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="nodeAdminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9c5bd"/>
      <stop offset="100%" stop-color="#7c677f"/>
    </linearGradient>

    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181424" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f0c18" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8076a3" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#9bc400" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f9c5bd" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="abstractShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Isometric Background Grid -->
  <g opacity="0.15">
    <path d="M0 100 L800 100 M0 200 L800 200 M0 300 L800 300 M0 400 L800 400 M0 500 L800 500" stroke="#8076a3" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M100 0 L100 620 M200 0 L200 620 M300 0 L300 620 M400 0 L400 620 M500 0 L500 620 M600 0 L600 620 M700 0 L700 620" stroke="#8076a3" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Ambient Organic Waves -->
  <path d="M100 180 C20 300, 80 500, 260 540 C440 580, 700 550, 740 380 C780 200, 620 60, 440 70 C280 80, 180 80, 100 180 Z" fill="url(#mainGlow)"/>

  <!-- Connected Synapse Lines between Hubs -->
  <path d="M180 340 C280 220, 340 200, 400 220 C460 240, 520 380, 620 310" stroke="url(#streamGrad1)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M180 340 C260 460, 540 480, 620 310" stroke="#8076a3" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" fill="none"/>
  <path d="M400 120 L400 220" stroke="#9bc400" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M400 220 L400 460" stroke="#7c677f" stroke-width="2" opacity="0.5"/>

  <!-- ================= CENTRAL PLATFORM CORE HUB ================= -->
  <g transform="translate(400, 220)">
    <!-- Outer Pulsing Orbit -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="#9bc400" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
    <circle cx="0" cy="0" r="54" fill="none" stroke="#8076a3" stroke-width="2" opacity="0.8"/>
    
    <!-- Central Glass Core -->
    <circle cx="0" cy="0" r="38" fill="#181424" stroke="#9bc400" stroke-width="2.5" filter="url(#abstractShadow)"/>
    <!-- Intersect Symbol in Core -->
    <path d="M-12 -12 A16 16 0 0 1 12 -12 A16 16 0 0 1 12 12 A16 16 0 0 1 -12 12 Z" fill="#9bc400" opacity="0.85"/>
    <circle cx="0" cy="0" r="6" fill="#f9c5bd"/>
  </g>

  <!-- ================= LEFT: CLIENT NODE & PROJECT BRIEF CARD ================= -->
  <!-- Client Floating Hub -->
  <g transform="translate(180, 340)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#8076a3" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="30" fill="url(#nodeClientGrad)" filter="url(#glowEffect)"/>
    <!-- Client Brief Icon -->
    <rect x="-10" y="-12" width="20" height="24" rx="3" fill="#ffffff"/>
    <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#7d3cff" stroke-width="2"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#7d3cff" stroke-width="2"/>
    <line x1="-6" y1="6" x2="2" y2="6" stroke="#7d3cff" stroke-width="2"/>
  </g>

  <!-- Client Floating UI Card -->
  <g transform="translate(60, 160)" filter="url(#abstractShadow)">
    <rect width="210" height="130" rx="16" fill="url(#cardSurface)" stroke="#8076a3" stroke-width="1.5"/>
    <!-- Card Header -->
    <rect x="16" y="16" width="32" height="6" rx="3" fill="#9bc400"/>
    <rect x="54" y="16" width="70" height="6" rx="3" fill="#7c677f"/>
    <!-- Role Badge -->
    <rect x="140" y="12" width="56" height="18" rx="9" fill="#8076a3" fill-opacity="0.25"/>
    <text x="168" y="24" fill="#f9c5bd" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">CLIENT</text>
    
    <!-- Code/Project Visual Bars -->
    <rect x="16" y="38" width="178" height="36" rx="8" fill="#1f1a30" stroke="#7c677f" stroke-width="0.8"/>
    <rect x="28" y="48" width="80" height="6" rx="3" fill="#f8fafc"/>
    <rect x="28" y="58" width="120" height="5" rx="2.5" fill="#8076a3"/>
    
    <!-- Milestone Escrow Status -->
    <g transform="translate(16, 86)">
      <circle cx="10" cy="16" r="8" fill="#9bc400" opacity="0.2"/>
      <circle cx="10" cy="16" r="3" fill="#9bc400"/>
      <text x="26" y="14" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Project Brief Active</text>
      <text x="26" y="26" fill="#9bc400" font-family="'Inter', sans-serif" font-size="8.5">Milestone Escrow Funded</text>
    </g>
  </g>

  <!-- ================= RIGHT: FREELANCER NODE & DELIVERY CARD ================= -->
  <!-- Freelancer Floating Hub -->
  <g transform="translate(620, 310)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#9bc400" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="30" fill="url(#nodeFreelancerGrad)" filter="url(#glowEffect)"/>
    <!-- Code Terminal Symbol -->
    <path d="M-8 -6 L-2 0 L-8 6 M2 6 L8 6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Freelancer Floating UI Card -->
  <g transform="translate(530, 140)" filter="url(#abstractShadow)">
    <rect width="210" height="130" rx="16" fill="url(#cardSurface)" stroke="#9bc400" stroke-width="1.5"/>
    <!-- Role Badge -->
    <rect x="16" y="12" width="76" height="18" rx="9" fill="#9bc400" fill-opacity="0.2"/>
    <text x="54" y="24" fill="#9bc400" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">FREELANCER</text>
    <rect x="140" y="16" width="54" height="6" rx="3" fill="#7c677f"/>

    <!-- Verification Checkpoints -->
    <g transform="translate(16, 40)">
      <rect width="178" height="42" rx="8" fill="#1f1a30" stroke="#7c677f" stroke-width="0.8"/>
      <circle cx="18" cy="21" r="10" fill="#9bc400" opacity="0.2"/>
      <path d="M14 21 L17 24 L23 18" stroke="#9bc400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="18" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Verified Pro Match</text>
      <text x="36" y="30" fill="#8076a3" font-family="'Inter', sans-serif" font-size="8.5">ID + Skills Vetted</text>
    </g>

    <!-- Skill Chips -->
    <g transform="translate(16, 92)">
      <rect x="0" y="0" width="48" height="18" rx="4" fill="#8076a3" fill-opacity="0.3"/>
      <text x="24" y="12" fill="#f9c5bd" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">React</text>
      
      <rect x="54" y="0" width="50" height="18" rx="4" fill="#8076a3" fill-opacity="0.3"/>
      <text x="79" y="12" fill="#f9c5bd" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">Django</text>

      <rect x="110" y="0" width="68" height="18" rx="4" fill="#9bc400" fill-opacity="0.25"/>
      <text x="144" y="12" fill="#9bc400" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">99% Match</text>
    </g>
  </g>

  <!-- ================= TOP: ADMIN PLATFORM GUARANTEE BADGE ================= -->
  <g transform="translate(310, 48)" filter="url(#abstractShadow)">
    <rect width="180" height="52" rx="14" fill="url(#cardSurface)" stroke="#f9c5bd" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="14" fill="url(#nodeAdminGrad)"/>
    <path d="M22 26 L25 29 L31 22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="23" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800">ADMIN OVERSIGHT</text>
    <text x="48" y="37" fill="#f9c5bd" font-family="'Inter', sans-serif" font-size="9">Platform Arbitration &amp; Trust</text>
  </g>

  <!-- ================= BOTTOM: DATA / METRIC PIPELINE FLOW ================= -->
  <g transform="translate(260, 420)" filter="url(#abstractShadow)">
    <rect width="280" height="96" rx="16" fill="url(#cardSurface)" stroke="#7c677f" stroke-width="1.2"/>
    
    <!-- Title -->
    <rect x="18" y="14" width="70" height="6" rx="3" fill="#9bc400"/>
    <text x="18" y="38" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800">Direct Collaboration Stream</text>

    <!-- Mini Progress Bars -->
    <g transform="translate(18, 52)">
      <rect width="244" height="6" rx="3" fill="#1f1a30"/>
      <rect width="170" height="6" rx="3" fill="url(#streamGrad1)"/>
    </g>

    <!-- Metrics Row -->
    <g transform="translate(18, 70)">
      <text x="0" y="12" fill="#8076a3" font-family="'Inter', sans-serif" font-size="9">Milestone 02 of 03</text>
      <text x="244" y="12" fill="#9bc400" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="end">In Progress (75%)</text>
    </g>
  </g>

  <!-- Floating Geometric Accent Nodes -->
  <g transform="translate(120, 470)">
    <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" fill="#9bc400"/>
  </g>
  <g transform="translate(680, 460)">
    <polygon points="10,0 13,8 20,10 13,12 10,20 7,12 0,10 7,8" fill="#f9c5bd"/>
  </g>
  <g transform="translate(490, 80)">
    <circle cx="0" cy="0" r="4" fill="#8076a3"/>
  </g>
  <g transform="translate(290, 140)">
    <circle cx="0" cy="0" r="5" fill="#9bc400"/>
  </g>
</svg>
