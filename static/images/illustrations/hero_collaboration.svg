<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="heroGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="clientSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="freelancerHoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Organic Background Blobs -->
  <path d="M120 180 C20 260, 60 480, 240 520 C420 560, 680 580, 720 400 C760 220, 640 80, 480 90 C320 100, 220 100, 120 180 Z" fill="url(#heroGlow)"/>
  
  <!-- Collaborative Arc & Floating Idea Nodes -->
  <path d="M220 280 C290 140, 510 140, 580 280" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="400" cy="170" r="28" fill="#1e293b" stroke="#6366f1" stroke-width="2" filter="url(#cardShadow)"/>
  <path d="M392 170 L398 176 L408 164" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Desk Base Surface -->
  <ellipse cx="400" cy="510" rx="340" ry="45" fill="#1e293b" opacity="0.4"/>
  <rect x="140" y="470" width="520" height="18" rx="9" fill="#334155"/>
  <rect x="220" y="488" width="16" height="70" rx="4" fill="#1e293b"/>
  <rect x="564" y="488" width="16" height="70" rx="4" fill="#1e293b"/>

  <!-- ================= CLIENT (LEFT) ================= -->
  <!-- Client Body & Attire -->
  <path d="M170 510 L195 380 Q215 365 240 375 L265 510 Z" fill="url(#clientSuit)"/>
  <path d="M217 375 L230 420 L243 375 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M226 385 L230 440 L234 385 Z" fill="#ef4444"/> <!-- Tie -->

  <!-- Client Head & Hair -->
  <circle cx="230" cy="315" r="32" fill="#fcd34d"/>
  <path d="M200 305 Q225 260 260 295 Q255 270 220 270 Q200 275 200 305 Z" fill="#475569"/> <!-- Hair -->
  <!-- Client Facial features -->
  <circle cx="242" cy="315" r="3.5" fill="#1e293b"/>
  <path d="M238 328 Q246 335 252 328" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Client Arm pointing toward screen/project -->
  <path d="M245 390 Q290 395 330 370" stroke="#fcd34d" stroke-width="16" stroke-linecap="round"/>
  <path d="M245 390 Q280 395 315 378" stroke="url(#clientSuit)" stroke-width="18" stroke-linecap="round"/>

  <!-- Client Tablet / Project Brief Document -->
  <g transform="translate(130, 390) rotate(-12)" filter="url(#cardShadow)">
    <rect width="90" height="120" rx="8" fill="#ffffff"/>
    <rect x="12" y="15" width="40" height="6" rx="3" fill="#6366f1"/>
    <rect x="12" y="30" width="66" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="42" width="55" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="54" width="60" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="75" width="66" height="30" rx="4" fill="#eff6ff"/>
    <circle cx="30" cy="90" r="8" fill="#3b82f6"/>
    <path d="M44 86 L68 86 M44 94 L60 94" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= FREELANCER (RIGHT) ================= -->
  <!-- Freelancer Body & Hoodie -->
  <path d="M535 510 L555 375 Q585 360 615 375 L635 510 Z" fill="url(#freelancerHoodie)"/>
  <!-- Freelancer Head & Headset -->
  <circle cx="585" cy="315" r="32" fill="#fbcfe8"/>
  <!-- Freelancer Modern Curly Hair -->
  <path d="M555 310 Q550 260 595 265 Q625 270 620 310 Q615 260 580 260 Q560 265 555 310 Z" fill="#0f172a"/>
  <!-- Freelancer Glasses & Smile -->
  <rect x="568" y="308" width="18" height="14" rx="4" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <rect x="590" y="308" width="18" height="14" rx="4" fill="none" stroke="#6366f1" stroke-width="2.5"/>
  <line x1="586" y1="315" x2="590" y2="315" stroke="#6366f1" stroke-width="2.5"/>
  <path d="M578 332 Q586 338 594 332" stroke="#1e293b" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Freelancer Arms on Keyboard -->
  <path d="M560 405 Q520 435 480 455" stroke="#fbcfe8" stroke-width="15" stroke-linecap="round"/>
  <path d="M565 400 Q530 425 500 445" stroke="url(#freelancerHoodie)" stroke-width="18" stroke-linecap="round"/>

  <!-- ================= CENTRAL WORKSTATION & CODE/DESIGN CANVAS ================= -->
  <!-- Monitor Stand -->
  <rect x="390" y="430" width="20" height="50" rx="3" fill="#475569"/>
  <ellipse cx="400" cy="480" rx="45" ry="8" fill="#334155"/>

  <!-- Main Ultra-wide Display -->
  <g filter="url(#cardShadow)">
    <rect x="290" y="240" width="220" height="190" rx="12" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <!-- Screen Header Bar -->
    <rect x="290" y="240" width="220" height="26" rx="12" fill="#1e293b"/>
    <circle cx="306" cy="253" r="4" fill="#ef4444"/>
    <circle cx="318" cy="253" r="4" fill="#f59e0b"/>
    <circle cx="330" cy="253" r="4" fill="#10b981"/>
    <rect x="350" y="248" width="90" height="10" rx="5" fill="#334155"/>

    <!-- Code & UI Dashboard Elements inside Display -->
    <!-- Left Sidebar of app -->
    <rect x="300" y="276" width="36" height="142" rx="4" fill="#1e293b"/>
    <rect x="306" y="284" width="24" height="6" rx="3" fill="#6366f1"/>
    <rect x="306" y="296" width="18" height="4" rx="2" fill="#64748b"/>
    <rect x="306" y="306" width="20" height="4" rx="2" fill="#64748b"/>
    <rect x="306" y="316" width="15" height="4" rx="2" fill="#64748b"/>

    <!-- Main Editor area with syntax tags -->
    <rect x="344" y="276" width="156" height="80" rx="6" fill="#182234"/>
    <path d="M354 290 L366 290" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M372 290 L395 290" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <path d="M354 302 L380 302" stroke="#a78bfa" stroke-width="3" stroke-linecap="round"/>
    <path d="M386 302 L410 302" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <path d="M354 314 L370 314" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <path d="M354 326 L390 326" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M354 338 L430 338" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

    <!-- UI Component Preview Card inside monitor -->
    <rect x="344" y="364" width="156" height="54" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="362" cy="391" r="12" fill="#10b981" opacity="0.2"/>
    <path d="M357 391 L361 395 L368 387" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="382" y="380" width="60" height="7" rx="3.5" fill="#f1f5f9"/>
    <rect x="382" y="393" width="90" height="5" rx="2.5" fill="#64748b"/>
  </g>

  <!-- Laptop Keyboard / Trackpad Base -->
  <rect x="420" y="458" width="90" height="12" rx="4" fill="#334155"/>
  <rect x="445" y="462" width="40" height="4" rx="2" fill="#64748b"/>

  <!-- ================= FLOATING BADGES & COLLABORATION CARDS ================= -->
  <!-- Top-Right Floating Milestone Badge -->
  <g transform="translate(560, 150) rotate(6)" filter="url(#cardShadow)">
    <rect width="170" height="64" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="30" cy="32" r="16" fill="#10b981" opacity="0.2"/>
    <path d="M24 32 L28 36 L36 28" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="28" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Milestone Approved</text>
    <text x="56" y="44" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Escrow Released</text>
  </g>

  <!-- Top-Left Floating Project Brief Pill -->
  <g transform="translate(70, 160) rotate(-6)" filter="url(#cardShadow)">
    <rect width="180" height="60" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#6366f1" opacity="0.25"/>
    <circle cx="28" cy="30" r="6" fill="#818cf8"/>
    <text x="52" y="26" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Project Brief Active</text>
    <text x="52" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Verified Match</text>
  </g>

  <!-- Floating Sparkles & Design Tokens -->
  <g transform="translate(490, 210)">
    <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" fill="#f59e0b"/>
  </g>
  <g transform="translate(260, 220)">
    <polygon points="8,0 10,6 16,8 10,10 8,16 6,10 0,8 6,6" fill="#10b981"/>
  </g>
  <g transform="translate(380, 110)">
    <polygon points="10,0 13,8 20,10 13,12 10,20 7,12 0,10 7,8" fill="#a855f7"/>
  </g>
</svg>
