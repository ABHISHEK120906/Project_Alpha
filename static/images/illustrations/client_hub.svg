<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="clientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shape -->
  <path d="M60 120 C20 220, 40 340, 160 360 C280 380, 440 360, 460 240 C480 120, 380 40, 260 50 C140 60, 100 80, 60 120 Z" fill="url(#clientBg)"/>

  <!-- Client Main Card (Project Creator) -->
  <g transform="translate(100, 70)" filter="url(#shadowC)">
    <rect width="300" height="250" rx="16" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5"/>
    
    <!-- Top Header -->
    <rect x="20" y="24" width="120" height="12" rx="6" fill="#3b82f6"/>
    <rect x="20" y="44" width="180" height="8" rx="4" fill="#64748b"/>
    <rect x="20" y="58" width="140" height="8" rx="4" fill="#475569"/>

    <!-- Project Post Simulator -->
    <rect x="20" y="80" width="260" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
    <circle cx="45" cy="105" r="14" fill="#3b82f6" opacity="0.2"/>
    <path d="M40 105 L44 109 L51 101" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="70" y="96" width="100" height="8" rx="4" fill="#f8fafc"/>
    <rect x="70" y="110" width="60" height="6" rx="3" fill="#10b981"/>

    <!-- Proposal Review List -->
    <g transform="translate(20, 145)">
      <rect width="260" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="25" cy="21" r="12" fill="#8b5cf6"/>
      <rect x="46" y="14" width="80" height="6" rx="3" fill="#f8fafc"/>
      <rect x="46" y="24" width="50" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="190" y="12" width="58" height="18" rx="6" fill="#10b981"/>
      <text x="219" y="24" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">HIRE</text>
    </g>

    <!-- Hire CTA Button inside card -->
    <g transform="translate(20, 200)">
      <rect width="260" height="34" rx="8" fill="#2563eb"/>
      <text x="130" y="21" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">POST YOUR PROJECT BRIEF</text>
    </g>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(40, 220) rotate(-8)" filter="url(#shadowC)">
    <rect width="130" height="48" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="12" fill="#3b82f6" opacity="0.2"/>
    <path d="M19 24 L23 28 L30 20" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <text x="44" y="21" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Verified Client</text>
    <text x="44" y="34" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Escrow Protected</text>
  </g>
</svg>
