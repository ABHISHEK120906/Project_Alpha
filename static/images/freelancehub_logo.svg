             C 46 34 41 34 38 36
             C 37 37 36 39 36 41
             C 40 41 46 41 49 42
             C 55 43 58 47 58 52
             C 58 57 54 61 48 62
             C 43 62 39 62 37 64
             C 36 65 36 67 36 71
             C 36 77 34 83 29 86
             C 24 88 18 87 15 82
             C 13 78 13 73 13 67
             L 13 28
             C 13 18 19 13 28 13 Z" 
          fill="url(#fhLogoLime)" />

    <!-- Right Arch Figure (Royal Purple) -->
    <path d="M 46 87
             C 45 71 49 54 60 45
             C 67 39 79 39 86 45
             C 93 51 93 67 93 87
             L 79 87
             C 79 72 79 57 74 55
             C 69 53 62 57 61 69
             L 61 87 Z" 
          fill="url(#fhLogoPurple)" />

    <!-- Talent Nexus Node (Soft Peach) -->
    <circle cx="73" cy="22" r="11" fill="url(#fhLogoPeach)" />
  </g>

  <!-- Wordmark Typography -->
  <text x="58" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.4">
    <tspan fill="currentColor">Freelance</tspan><tspan fill="#9BC400">Hub</tspan>
  </text>
