      <stop offset="0%" stop-color="#C6F000" />
      <stop offset="100%" stop-color="#8DBF00" />
    </linearGradient>
    <linearGradient id="fhLogoPurple" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#9960FF" />
      <stop offset="100%" stop-color="#551CC0" />
    </linearGradient>
    <linearGradient id="fhLogoPeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD4CA" />
      <stop offset="100%" stop-color="#F99B85" />
