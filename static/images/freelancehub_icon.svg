<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Squircle Gradient (Deep Obsidian Forest) -->
    <linearGradient id="fhSquircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2913" />
      <stop offset="100%" stop-color="#050B06" />
    </linearGradient>

    <!-- Client Wing Gradient (Emerald to Teal Forest) -->
    <linearGradient id="fhClientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <!-- Freelancer Wing Gradient (Electric Lime to Neon Green) -->
    <linearGradient id="fhFreelancerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <!-- Connection & Growth Apex Node (Mint Glow to Electric Lime) -->
    <linearGradient id="fhGrowthNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#BEF264" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
  </defs>

  <!-- Squircle Tile Container with Neon Border -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#fhSquircleBg)" stroke="rgba(163, 230, 53, 0.35)" stroke-width="2"/>

  <!-- Master Collaboration & Growth Emblem -->
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Client Initiating Pillar & Arch ('F' Flow) -->
    <path d="M 22 14
             C 34 14 44 14 50 16
             C 58 18 62 23 62 29
             C 62 35 56 40 48 42
             C 42 43 36 43 34 47
             C 32 50 32 54 32 62
             C 32 72 28 80 22 84
             C 17 86 11 84 9 78
             C 7 73 7 66 7 58
             L 7 28
             C 7 18 13 14 22 14 Z" 
          fill="url(#fhClientGrad)" />

    <!-- Freelancer Ascending Wing & Project Arch ('H' Uplink) -->
    <path d="M 42 84
             C 41 68 46 50 58 40
             C 66 34 78 34 86 41
             C 93 48 93 66 93 84
             L 77 84
             C 77 69 76 54 70 51
             C 64 49 56 54 55 67
             L 55 84 Z" 
          fill="url(#fhFreelancerGrad)" />

    <!-- Central Connection Bridge -->
    <path d="M 32 46
             C 38 46 44 46 48 47
             C 52 48 54 51 54 55
             C 54 59 50 62 44 62
             L 32 62 Z" 
          fill="rgba(163, 230, 53, 0.45)" />

    <!-- Growth Beacon / Milestone Apex Node -->
    <circle cx="74" cy="20" r="11" fill="url(#fhGrowthNode)" />
  </g>
</svg>
